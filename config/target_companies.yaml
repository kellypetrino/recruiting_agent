# Target companies for the job-scraping agent.
#
# Tier 1 = highest priority, check daily, surface aggressively.
# Tier 2 = strong interest, check daily, normal scoring.
# Tier 3 = opportunistic, check daily, only surface if score is high.
#
# ats: which provider hosts the company's job board. One of:
#   greenhouse | lever | ashby | workday | custom
# board_id: the company's slug on that ATS.
#   Greenhouse: boards-api.greenhouse.io/v1/boards/{board_id}/jobs
#   Lever:      api.lever.co/v0/postings/{board_id}
#   Ashby:      api.ashbyhq.com/posting-api/job-board/{board_id}

companies:
  # ---------- Tier 1 ----------
  - name: Anthropic
    tier: 1
    ats: greenhouse
    board_id: anthropic
    notes: "Highest timing risk per job tracker. Surface aggressively."

  - name: OpenAI
    tier: 1
    ats: ashby
    board_id: openai

  - name: Cursor
    tier: 1
    ats: custom
    board_id: TODO
    notes: "Have warm contact (Zoë Barnswell, Enterprise GTM). Tailored resume exists. Careers page: cursor.com/careers — verify ATS."

  # ---------- Tier 2 ----------
  - name: Figma
    tier: 2
    ats: greenhouse
    board_id: figma

  - name: Scale AI
    tier: 2
    ats: greenhouse
    board_id: scaleai

  - name: Mistral
    tier: 2
    ats: lever
    board_id: mistral

  - name: Cohere
    tier: 2
    ats: ashby
    board_id: cohere

  - name: Harvey
    tier: 2
    ats: ashby
    board_id: harvey
    notes: "AI for legal, NYC-based."

  - name: Glean
    tier: 2
    ats: greenhouse
    board_id: gleanwork
    notes: "Enterprise AI search."

  - name: Perplexity
    tier: 2
    ats: ashby
    board_id: perplexity

  - name: Notion
    tier: 2
    ats: ashby
    board_id: notion

  - name: Palantir
    tier: 2
    ats: lever
    board_id: palantir
    notes: "Big NYC presence, forward deployed roles are a natural fit."

  - name: Google
    tier: 2
    ats: custom
    board_id: TODO
    notes: "careers.google.com — no standard ATS. Set up alert emails."

  - name: Meta
    tier: 2
    ats: custom
    board_id: TODO
    notes: "Have HBS alum contact (Anny Jeung). metacareers.com — no standard ATS."

  # ---------- Tier 3 ----------
  - name: Replit
    tier: 3
    ats: ashby
    board_id: replit

  - name: Ramp
    tier: 3
    ats: ashby
    board_id: ramp
    notes: "Fintech AI, NYC HQ."

  - name: Intercom
    tier: 3
    ats: greenhouse
    board_id: intercom
    notes: "AI customer support."

  - name: Airtable
    tier: 3
    ats: greenhouse
    board_id: airtable

  - name: Datadog
    tier: 3
    ats: greenhouse
    board_id: datadog
    notes: "Strong PM hiring, NYC HQ."

  - name: Character.ai
    tier: 3
    ats: ashby
    board_id: character

  - name: Runway
    tier: 3
    ats: ashby
    board_id: runway
    notes: "AI video, NYC-based."

# Search filters applied across all sources at the rule-based pre-filter stage.
filters:
  title_keywords_include:
    - "product manager"
    - "product"
    - "PM"
    - "GTM"
    - "go-to-market"
    - "deployment"
    - "forward deployed"
    - "solutions"
    - "applied"
    - "technical program"
  title_keywords_exclude:
    - "director"
    - "VP"
    - "vice president"
    - "head of"
    - "principal"
    - "intern"
    - "junior"
  locations_include:
    - "new york"
    - "nyc"
    - "ny"
    - "remote"
    - "remote - us"
    - "remote (us)"
    - "united states"
  max_age_days: 14
